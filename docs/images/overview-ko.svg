<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">논문 속 근거를 원고의 인용으로.</title><desc id="desc">원고, 미리보기, 참고 논문과 연구 노트를 한 화면에.</desc><rect width="1440" height="900" rx="20" fill="#202522"/><g font-family="Pretendard,sans-serif"><text x="64" y="88" fill="#f3f5ef" font-size="48" font-weight="650">논문 속 근거를 원고의 인용으로.</text><text x="64" y="135" fill="#b6c3b4" font-size="24" font-weight="400">원고, 미리보기, 참고 논문과 연구 노트를 한 화면에.</text><text x="64" y="220" fill="#f3f5ef" font-size="28" font-weight="600">논문에서 찾기</text><text x="64" y="257" fill="#b6c3b4" font-size="18" font-weight="400">PDF 원문 · 본문 검색 · 로컬 OCR</text><rect x="64" y="286" width="416" height="310" rx="10" fill="#f6f7f2" stroke="#49574b"/><text x="92" y="330" fill="#27372b" font-size="23" font-weight="600">Evidence study</text><text x="92" y="362" fill="#526453" font-size="17" font-weight="400">Results</text><path d="M92 389h350m-350 27h330m-330 27h350m-350 27h260m-260 52h350m-350 27h290" stroke="#c5cec0" stroke-width="7"/><rect x="88" y="430" width="360" height="49" fill="#c5d2b5" opacity=".65"/><text x="92" y="576" fill="#526453" font-size="16" font-weight="400">Source PDF / p. 12</text><path d="M484 436h22m-8-7 8 7-8 7" fill="none" stroke="#b8c7a4" stroke-width="2"/><text x="512" y="220" fill="#f3f5ef" font-size="28" font-weight="600">페이지와 함께 기록</text><text x="512" y="257" fill="#b6c3b4" font-size="18" font-weight="400">선택한 문장 · 연구 메모 · AI 질문</text><rect x="512" y="286" width="416" height="310" rx="10" fill="#29312b" stroke="#49574b"/><text x="540" y="330" fill="#c5d2b5" font-size="18" font-weight="600">Evidence2026 · p.12</text><path d="M540 357v86" stroke="#c5d2b5" stroke-width="3"/><text x="558" y="388" fill="#dce4dc" font-size="21" font-weight="400">핵심 주장을 메모하고</text><text x="558" y="423" fill="#dce4dc" font-size="21" font-weight="400">근거 페이지를 함께 남깁니다.</text><path d="M540 465h350m-350 24h280" stroke="#536150" stroke-wid